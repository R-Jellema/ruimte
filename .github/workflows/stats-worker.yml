name: Usage dashboard

on:
    push:
        branches: [main]
        paths:
            - '.github/workflows/stats-worker.yml'
            - 'apps/stats-worker/**'
            - 'packages/pulsar/**'
            - 'bun.lock'

concurrency:
    group: stats-worker
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        # The API token only reaches the step that deploys, never the install, the typecheck or the tests.
        env:
            CLOUDFLARE_ACCOUNT_ID: 5e565cf9fa55b0eae1f8131903da2ca9
        defaults:
            run:
                working-directory: apps/stats-worker
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/install
            - run: bun run typecheck
            - run: bun test
            - run: bun test
              working-directory: packages/pulsar
            - uses: ./.github/actions/wait-for-ci
            - run: bun run deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
