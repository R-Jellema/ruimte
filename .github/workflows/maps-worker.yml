name: Map service

on:
    push:
        branches: [main]
        paths:
            - '.github/workflows/maps-worker.yml'
            - 'apps/maps-worker/**'
            - 'packages/pulsar/**'
            - 'bun.lock'

concurrency:
    group: maps-worker
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        # The API token only reaches the step that deploys, never the install, the typecheck or the tests.
        env:
            CLOUDFLARE_ACCOUNT_ID: 5e565cf9fa55b0eae1f8131903da2ca9
        defaults:
            run:
                working-directory: apps/maps-worker
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/install
            - run: bun run typecheck
            - run: bun test
            - run: bun test
              working-directory: packages/pulsar
            - uses: ./.github/actions/wait-for-ci
            # The service reports its errors and warnings under the commit it ships.
            - run: bun run deploy -- --var "OBSERVATORY_RELEASE:maps@${GITHUB_SHA::12}"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            - run: curl --fail --silent --show-error --max-time 20 https://maps.ruimte.app/health
