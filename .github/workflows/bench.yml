name: Bench

# The bench ships with a release, never with a push: release.yml dispatches this once it published a
# release as Latest. CI already passed on the tagged commit before that release was published. Only a
# dispatch starts it, so a release of an older line published by hand never takes the bench back.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The release to deploy, without the v (0.2.0); its tag has to exist
        required: true

# One deploy at a time, so an older build never lands after a newer one.
concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 5e565cf9fa55b0eae1f8131903da2ca9
      RELEASE_TAG: v${{ inputs.version }}
    defaults:
      run:
        working-directory: apps/bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/install
      - run: bun run typecheck
      - run: bun test
      - run: bun test src/shell/models
        working-directory: apps/client
      # The bench reports its errors and sessions under the release it ships.
      - name: Build
        env:
          RUIMTE_TELEMETRY: '1'
        run: |
          export RUIMTE_VERSION="${RELEASE_TAG#v}"
          echo "RUIMTE_VERSION=$RUIMTE_VERSION" >> "$GITHUB_ENV"
          bun run build
      - uses: ./.github/actions/client-source-maps
        with:
          dist: apps/bench/dist
          release: ruimte@${{ env.RUIMTE_VERSION }}
          token: ${{ secrets.OBSERVATORY_UPLOAD_TOKEN }}
      - run: bunx wrangler deploy
        env:
          # The token the station deploys with, which covers the Custom Domain `bench.ruimte.app` on the zone too.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The page has to answer with its policy, or the deploy is not what this repository says it is.
      - run: curl --fail --silent --show-error --max-time 20 --head https://bench.ruimte.app/ | grep -i '^content-security-policy:.*frame-ancestors'
