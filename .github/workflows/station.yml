name: Station

# The station ships with a release, never with a push: release.yml dispatches this once it published
# a release as Latest, so the web client runs what the desktop app and the iPhone app run. CI already
# passed on the tagged commit before that release was published. Only a dispatch starts it, so a
# release of an older line published by hand never takes the station back.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The release to deploy, without the v (0.2.0); its tag has to exist
        required: true

# One deploy at a time, so an older build never lands after a newer one.
concurrency:
  group: station
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 5e565cf9fa55b0eae1f8131903da2ca9
      RELEASE_TAG: v${{ inputs.version }}
    defaults:
      run:
        working-directory: apps/station
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/install
      - run: bun run typecheck
      - run: bun test
      - run: bun test src/station.test.ts src/pulsar src/transport/wake.test.ts
        working-directory: apps/client
      # The station reports its errors and sessions under the release it ships, beside the desktop app's.
      - name: Build
        env:
          RUIMTE_TELEMETRY: '1'
        run: |
          export RUIMTE_VERSION="${RELEASE_TAG#v}"
          echo "RUIMTE_VERSION=$RUIMTE_VERSION" >> "$GITHUB_ENV"
          bun run build
      - uses: ./.github/actions/client-source-maps
        with:
          dist: apps/station/dist
          release: ruimte@${{ env.RUIMTE_VERSION }}
          token: ${{ secrets.OBSERVATORY_UPLOAD_TOKEN }}
      - run: bunx wrangler deploy
        env:
          # The same token the address book deploys with: Workers Scripts Edit on the account, and on the zone
          # `ruimte.app` Workers Routes Edit and Zone Read, which the Custom Domain `station.ruimte.app` needs.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The page has to answer with its policy, or the deploy is not what this repository says it is.
      - run: curl --fail --silent --show-error --max-time 20 --head https://station.ruimte.app/ | grep -i '^content-security-policy:.*frame-ancestors'
