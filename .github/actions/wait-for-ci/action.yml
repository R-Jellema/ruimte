name: Wait for CI
description: Hold a deploy until ci.yml passed on the pushed commit it ships, and fail it when CI did not
# The job needs `actions: read` for its token.

runs:
  using: composite
  steps:
    - name: CI on this commit
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # The push that started the deploy starts CI as well, and its run takes a moment to appear.
        run=""
        for _ in $(seq 1 30); do
          run=$(gh run list --workflow ci.yml --commit "$SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ]; then
            break
          fi
          sleep 10
        done
        if [ -z "$run" ]; then
          echo "::error::ci.yml has no run for a push of $SHA, so it was never checked on main."
          exit 1
        fi
        echo "Waiting for $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run"
        if ! gh run watch "$run" --exit-status --interval 30 > /dev/null; then
          echo "::error::ci.yml did not pass on $SHA."
          exit 1
        fi
